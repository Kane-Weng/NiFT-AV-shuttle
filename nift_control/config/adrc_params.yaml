# ADRC and vehicle bridge parameters.
# Used by trajectory_controller (production); longitudinal_test (adrc, tune) reads the same values as its defaults.

trajectory_controller:
  ros__parameters:
    adrc:
      b0: 0.5       # System gain: how powerfully throttle affects speed
      w_cl: 2.0     # Controller bandwidth: how aggressively it chases the target. The code uses Kp = 2 * w_cl,
                    #   so the ideal loop settles in about 2 / w_cl s (1 s), before the shuttle's delays
      k_eso: 5.0    # Observer bandwidth ratio: the ESO poles sit at k_eso * w_cl (10 rad/s), k_eso / 2 times the loop
    vehicle_bridge:
      zero_speed_tolerance: 0.1  # m/s — speed below which the vehicle is considered stopped
