# Test pad, for `longitudinal_test monitor` (top-down map) and the garage test procedures.
# Map frame = UTM 17N minus the UTM of map_origin (system.launch.py's map_origin_lat / _lon), metres.
# This public copy is an example: a 40 x 12 m rectangle at the map origin, with no start poses or
# goals. Replace it with your own pad (the area you have driven, its start poses and goals).
garage_pad:
  map_origin: [42.3005, -83.6987]   # = nift_common site.py MAP_ORIGIN_LAT / _LON; driven_area is in this frame
  axis_yaw_deg: 0.0                 # the pad's long axis in the map frame (east = 0)
  antenna_ahead_of_base_link: 1.041 # = nift_common vehicle.yaml gnss_front_x, as shuttle_tf_node runs it
  # Area the shuttle's footprint covered (convex hull of the GNSS tracks), map frame [m]:
  # the pad is at least this big.
  driven_area:
    - [-20.0, -6.0]
    - [20.0, -6.0]
    - [20.0, 6.0]
    - [-20.0, 6.0]
  # Start poses (front antenna) and goals; heading = compass deg. Example entries:
  #   starts: [{name: E start, lat: <deg>, lon: <deg>, heading: 90.0}]
  #   goals:  [{name: E10, lat: <deg>, lon: <deg>}]
  starts: []
  goals: []
