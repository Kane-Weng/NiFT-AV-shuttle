lidar_node:
  ros__parameters:
    voxel_size: 0.05                 # meters — voxel grid leaf size; applied before RANSAC to reduce input density
    ransac_max_iterations: 120
    ransac_distance_threshold: 0.15  # meters — max point-to-plane distance to count as ground
    dbscan_eps: 0.6                  # meters — max distance between points in same cluster
    dbscan_min_points: 3             # minimum points required to form a cluster core
    min_cluster_size: 3              # clusters smaller than this are discarded
    max_cluster_size: 5000           # clusters larger than this are discarded (likely ground leak)
    min_hull_points: 3               # minimum hull vertices to publish a polygon
    roi:
      min_x: 0.3
      max_x: 12.0
      min_y: -4.0
      max_y: 4.0
      min_z: -1.5
      max_z: 2.0
